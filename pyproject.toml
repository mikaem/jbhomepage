[project]
name = "jbhomepage"
version = "2.0.0"
description = "Homepage of Professor Mikael Mortensen, built with Jupyter Book 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mikael Mortensen", email = "mikaem@math.uio.no" },
]
dependencies = [
    "jupyter-book>=2.1.6",
]

[dependency-groups]
dev = [
    "ghp-import>=2.1.0",
    "jupytext>=1.16",
    "nbformat>=5.10",
]

[tool.uv]
package = false
